name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# OIDC: GitHub mints a short-lived token that AWS STS exchanges for the
# module-6-dev-github-actions role. No access keys are stored anywhere.
permissions:
  contents: read
  id-token: write

concurrency:
  group: build-and-push
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and test
        run: mvn -B -q verify

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker build --build-arg APP_VERSION=${GITHUB_SHA} -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .

      # Upload the deploy bundle BEFORE pushing the image: the push is what
      # fires EventBridge -> CodePipeline, which reads this bundle from S3.
      - name: Render and upload CodeDeploy bundle
        env:
          APP_VERSION: ${{ github.sha }}
          TASK_EXECUTION_ROLE_ARN: ${{ vars.TASK_EXECUTION_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ vars.TASK_ROLE_ARN }}
          DB_PROXY_ENDPOINT: ${{ vars.DB_PROXY_ENDPOINT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          REDIS_ENDPOINT: ${{ vars.REDIS_ENDPOINT }}
          REDIS_SECRET_ARN: ${{ vars.REDIS_SECRET_ARN }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p rendered
          envsubst '${APP_VERSION} ${TASK_EXECUTION_ROLE_ARN} ${TASK_ROLE_ARN} ${DB_PROXY_ENDPOINT} ${DB_NAME} ${DB_USER} ${REDIS_ENDPOINT} ${REDIS_SECRET_ARN} ${AWS_REGION}' \
            < ecs/taskdef.json > rendered/taskdef.json
          jq empty rendered/taskdef.json
          cp ecs/appspec.yaml rendered/appspec.yaml
          (cd rendered && zip -q ../bundle.zip taskdef.json appspec.yaml)
          aws s3 cp bundle.zip "s3://${ARTIFACT_BUCKET}/deploy/bundle.zip"

      # The 'latest' push is the deployment trigger (EventBridge filters on it).
      - name: Push image (SHA tag, then latest)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          echo "### Pushed \`$IMAGE:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "EventBridge will start CodePipeline for the blue/green deployment." >> "$GITHUB_STEP_SUMMARY"
