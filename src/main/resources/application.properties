spring.application.name=module-6-app
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

app.version=${APP_VERSION:local}

# --- Database: RDS PostgreSQL via RDS Proxy (IAM auth, TLS) ---------------
app.db.iam-auth=${DB_IAM_AUTH:false}
app.db.host=${DB_HOST:localhost}
app.db.port=${DB_PORT:5432}
app.db.name=${DB_NAME:module6}
app.db.username=${DB_USER:postgres}
# Used only when app.db.iam-auth=false (local development)
spring.datasource.url=jdbc:postgresql://${app.db.host}:${app.db.port}/${app.db.name}
spring.datasource.username=${app.db.username}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Cache: ElastiCache Redis (TLS + AUTH) --------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
app.cache.ttl-seconds=${CACHE_TTL_SECONDS:300}

# --- Ops -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.health.redis.enabled=false
